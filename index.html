<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test de CI · Diploma</title>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@500;800&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#10231c;--ink:#f4f1e6;--gold:#e0a82e;--paper:#e9f1ea;--green:#1b4332;--card:#18382d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px}
main{max-width:560px;margin:0 auto;padding:20px 18px 40px}
h1,h2{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;line-height:1.15;margin:0 0 14px}
h1{font-size:2.3rem;color:var(--gold)}
h2{font-size:1.35rem}
p{line-height:1.5;margin:0 0 14px}
input{width:100%;padding:14px;border-radius:10px;border:2px solid var(--gold);background:var(--card);color:var(--ink);font:inherit;margin-bottom:14px}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:10px;padding:14px 18px;background:var(--gold);color:#1b1405;width:100%}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.opt{background:var(--card);color:var(--ink);text-align:left;margin-bottom:10px;border:2px solid #2d5a49;font-weight:500}
.opt:active{border-color:var(--gold)}
.bar{height:8px;background:var(--card);border-radius:8px;margin-bottom:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.tm{height:10px;background:var(--card);border-radius:10px;margin:0 0 18px;overflow:hidden}
.tm i{display:block;height:100%;width:100%;background:#58c48a;transition:width 12s linear,background .3s}
.tm i.low{background:#e5584b}
.big{font-size:3.4rem;line-height:1.2;text-align:center;margin:6px 0 16px;letter-spacing:.06em;overflow-wrap:anywhere}
.mem{font-size:2.3rem;font-family:'Alfa Slab One',serif;color:var(--gold)}
.small{font-size:.85rem;opacity:.75}
.dip{background:var(--paper);color:var(--green);border:10px double #c9962b;padding:26px 16px;text-align:center;border-radius:4px}
.dip h2{font-size:1.5rem;color:var(--green)}
.nm{font-family:'Pinyon Script',cursive;font-size:2.6rem;line-height:1.1;margin:6px 0;border-bottom:2px solid var(--green);display:inline-block;padding:0 10px;max-width:100%;overflow-wrap:anywhere}
.ci{font-family:'Alfa Slab One',serif;font-size:4rem;line-height:1;margin:10px 0 2px}
.ttl{font-weight:800;font-size:1.15rem;margin:8px 0}
.seal{width:84px;height:84px;border-radius:50%;margin:16px auto 8px;background:radial-gradient(circle,#f1c453,#b8841c);color:#4a3306;display:grid;place-items:center;font-family:'Alfa Slab One',serif;font-size:.8rem;box-shadow:0 0 0 5px #e9f1ea,0 0 0 8px #c9962b}
.btns{display:grid;gap:10px;margin-top:16px}
.btns .alt{background:transparent;color:var(--ink);border:2px solid var(--gold)}
.rk{margin-top:26px}
.rk ol{list-style:none;margin:0 0 10px;padding:0}
.rk li{display:flex;gap:10px;align-items:baseline;background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.rk li.me{border:2px solid var(--gold)}
.rk b{font-family:'Alfa Slab One',serif;font-weight:400;color:var(--gold);min-width:1.8em}
.rk span{flex:1;overflow-wrap:anywhere}
.rk em{font-style:normal;font-weight:800}
.pd{display:flex;align-items:flex-end;gap:8px;margin:12px 0 20px}
.pd>div{flex:1;text-align:center;min-width:0}
.pd .pn{font-weight:800;overflow-wrap:anywhere;line-height:1.2}
.pd .st{border-radius:8px 8px 0 0;display:grid;place-items:center;margin-top:6px;color:#1b1405;font-family:'Alfa Slab One',serif;font-size:1.6rem}
@media(prefers-reduced-motion:reduce){.tm i{transition-duration:12s}}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,addDoc,getDocs,collection,query,orderBy,limit,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
var firebaseConfig={apiKey:"AIzaSyCpmJ-6HXrfLa4CxSLiHodlrD-ffE1U7Ns",authDomain:"test-de-ci-66304.firebaseapp.com",projectId:"test-de-ci-66304",storageBucket:"test-de-ci-66304.firebasestorage.app",messagingSenderId:"131272562014",appId:"1:131272562014:web:5d084ef5a10253eb60abcf"};
var app0=initializeApp(firebaseConfig),auth=getAuth(app0),db=getFirestore(app0),user=null,jugando=false;
var Q=[
{q:"¿Cuál es la capital de Honduras?",v:"🇭🇳",o:["San Pedro Sula","Tegucigalpa","Comayagua","La Ceiba"],a:1},
{q:"¿Cuál es la capital de Francia?",v:"🇫🇷",o:["Lyon","Marsella","París","Niza"],a:2},
{q:"¿Cuál es la capital de Japón?",v:"🇯🇵",o:["Tokio","Pekín","Seúl","Osaka"],a:0},
{q:"¿Cuál es la capital de Brasil?",v:"🇧🇷",o:["Río de Janeiro","São Paulo","Brasilia","Salvador"],a:2},
{q:"¿De qué país es esta bandera?",v:"🇮🇹",o:["Italia","México","Irlanda","Hungría"],a:0},
{q:"¿Cuál es el planeta rojo?",v:"🪐",o:["Venus","Júpiter","Marte","Saturno"],a:2},
{q:"¿Cuál es el océano más grande?",v:"🌊",o:["Atlántico","Pacífico","Índico","Ártico"],a:1},
{q:"¿Cuántas patas tiene una araña?",v:"🕷️",o:["6","8","10","4"],a:1},
{q:"¿Cuál es la moneda de Honduras?",v:"💵",o:["Quetzal","Colón","Lempira","Córdoba"],a:2},
{q:"¿Quién pintó la Mona Lisa?",v:"🖼️",o:["Picasso","Da Vinci","Van Gogh","Dalí"],a:1},
{q:"¿Quién ganó el Mundial de 2022?",v:"🏆",o:["Francia","Brasil","Argentina","Croacia"],a:2},
{q:"¿Qué sigue en la secuencia?",v:"🔴🔵🔴🔵🔴❓",o:["🔴","🔵","🟡","🟢"],a:1},
{q:"¿Qué sigue en la secuencia?",v:"🟦🟦🟨🟦🟦🟨🟦🟦❓",o:["🟦","🟨","🟥","🟩"],a:1},
{q:"¿Qué número sigue?",v:"2 · 4 · 6 · 8 · ❓",o:["9","10","12","14"],a:1},
{q:"¿Qué palabra no encaja con las demás?",v:"🍎 🍌 🥕 🍇",o:["Manzana","Banano","Zanahoria","Uva"],a:2},
{q:"Pájaro es a volar como pez es a…",v:"🐦 ➜ 🐟",o:["Correr","Nadar","Saltar","Cantar"],a:1},
{q:"¿Qué pesa más: un kilo de plumas o un kilo de piedras?",v:"🪶 🪨",o:["Las plumas","Las piedras","Pesan igual","Depende"],a:2},
{q:"Descifra la palabra: las letras están revueltas",v:"R R O P E",o:["PERRO","PUERTO","PRIMO","POZO"],a:0},
{q:"Descifra la palabra: las letras están revueltas",v:"B O L R A",o:["LIBRO","ÁRBOL","MORAL","PLAYA"],a:1},
{q:"Descifra la palabra: las letras están revueltas",v:"T N O M A Ñ A",o:["MAÑANA","MANZANA","MONTAÑA","CAMPANA"],a:2},
{q:"¿Cuál es un sinónimo de feliz?",v:"😀",o:["Triste","Contento","Cansado","Enojado"],a:1},
{q:"¿Qué letra falta para formar una palabra?",v:"C A M _ N O",o:["A","E","I","U"],a:2},
{s:"5 8 2 7 1",ms:3500,q:"¿Cuál era el tercer número?",o:["2","8","7","1"],a:0},
{s:"9 4 6 3",ms:3000,q:"¿Cuál era el último número?",o:["9","4","6","3"],a:3},
{s:"🐶 🚗 🍕 🏠",ms:3500,q:"¿Cuál iba en segundo lugar?",o:["🐶","🚗","🍕","🏠"],a:1},
{s:"🔴 🟢 🔵 🟡",ms:3500,q:"¿Qué color iba primero?",o:["🟢","🔵","🔴","🟡"],a:2},
{s:"MANGO LIMÓN PIÑA",ms:3500,q:"¿Qué fruta iba en medio?",o:["Mango","Limón","Piña","Uva"],a:1},
{s:"7 3 9 2 5 8",ms:4500,q:"¿Qué número estaba en la posición 4?",o:["3","9","2","5"],a:2},
{s:"🐱 🐸 🦊",ms:3000,q:"¿Cuál de estos animales NO estaba?",o:["🐱","🐸","🦊","🐵"],a:3},
{s:"ANA · 37",ms:3500,q:"¿Qué número acompañaba al nombre?",o:["73","37","27","38"],a:1}
];
var T=[
{f:.9,t:"Doctor Honoris Causa en Pensadera",m:"Hasta Einstein te pide tareas."},
{f:.8,t:"Licenciado en Mente Brillante",m:"Tu cerebro anda en cuarta velocidad."},
{f:.7,t:"Ingeniero en Neuronas Activas",m:"Muy bien, vos sí pensás."},
{f:.6,t:"Técnico Superior en Sentido Común",m:"Arriba del promedio, sin presumir."},
{f:.45,t:"Bachiller en Echarle Ganas",m:"Promedio sólido, buena base."},
{f:.3,t:"Maestro en Casi Casi",m:"Estuvo cerquita, la próxima sale."},
{f:0,t:"Aspirante con Mucho Corazón",m:"Las neuronas andaban de vacaciones."}
];
var app=document.getElementById('app'),nombre='',L=[],i=0,pts=0,miss=0,tm=null;
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function sh(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}
function inicio(){
 clearTimeout(tm);stop();jugando=false;
 if(!user){
  app.innerHTML='<h1>Test de CI</h1><p>'+Q.length+' preguntas de todo: países, capitales, cultura general, lógica, palabras y memoria. Tenés <b>12 segundos</b> por pregunta. Entrá con tu cuenta para que tus resultados se guarden y salgas en el ranking.</p><button id="lg">Entrar con Google</button><p class="small" id="er" style="margin-top:14px">Es solo para divertirse: no mide el CI real.</p>';
  document.getElementById('lg').onclick=function(){signInWithPopup(auth,new GoogleAuthProvider()).catch(function(e){document.getElementById('er').textContent='No se pudo entrar: '+(e.code||'error')})};
  return;
 }
 app.innerHTML='<h1>Test de CI</h1><p>Hola. Son '+Q.length+' preguntas, <b>12 segundos</b> cada una. Se guarda tu mejor resultado y todos tus intentos.</p><input id="n" maxlength="30" placeholder="Tu nombre" autocomplete="off" value="'+esc((user.displayName||'').split(' ')[0])+'"><button id="go">Empezar el test</button><p class="small" style="margin-top:14px"><a href="#" id="so" style="color:inherit">Salir de esta cuenta</a> · Es solo diversión, no mide el CI real.</p>';
 document.getElementById('go').onclick=function(){var v=document.getElementById('n').value.trim();if(!v){document.getElementById('n').focus();return}nombre=v;empezar()};
 document.getElementById('so').onclick=function(e){e.preventDefault();signOut(auth)};
}
function empezar(){stop();jugando=true;L=sh(Q);i=0;pts=0;miss=0;paso()}
function head(){return '<div class="bar"><i style="width:'+(i/L.length*100)+'%"></i></div><p class="small">Pregunta '+(i+1)+' de '+L.length+'</p>'}
function paso(){
 var q=L[i];window.scrollTo(0,0);
 if(q.s){
  app.innerHTML=head()+'<h2>Memorizá esto</h2><div class="big mem">'+esc(q.s)+'</div><div class="tm"><i id="b" style="transition-duration:'+q.ms+'ms"></i></div>';
  go();tm=setTimeout(function(){ask(q)},q.ms);
 }else ask(q);
}
function go(){var b=document.getElementById('b');b.offsetWidth;b.style.width='0%'}
function ask(q){
 var o=sh(q.o.map(function(t,k){return{t:t,ok:k===q.a}}));
 var h=head()+'<div class="tm"><i id="b"></i></div>'+(q.v?'<div class="big">'+q.v+'</div>':'')+'<h2>'+esc(q.q)+'</h2>';
 o.forEach(function(x,k){h+='<button class="opt" data-k="'+k+'">'+esc(x.t)+'</button>'});
 app.innerHTML=h;go();
 var low=setTimeout(function(){var b=document.getElementById('b');if(b)b.className='low'},9000);
 function fin(ok,to){clearTimeout(tm);clearTimeout(low);if(ok)pts++;if(to)miss++;i++;i<L.length?paso():diploma()}
 Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){fin(o[+b.dataset.k].ok,false)}});
 tm=setTimeout(function(){fin(false,true)},12000);
}
var unsub=null,LINK=location.href.split('#')[0];
function stop(){if(unsub){unsub();unsub=null}}
function compartir(ci,pts,b){
 var t='🎓 Saqué CI '+ci+' ('+pts+'/'+L.length+') en el Test de CI. ¿Me ganás? '+LINK;
 if(navigator.share){navigator.share({text:t}).catch(function(){});return}
 if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){b.textContent='¡Copiado! Pegalo en WhatsApp'},function(){b.textContent='No se pudo copiar'})}
}
async function ranking(ci,pts){
 var box=document.getElementById('rk');
 try{
  var uid=user.uid,ref=doc(db,'scores',uid),sn=await getDoc(ref),old=sn.exists()?sn.data():null;
  await addDoc(collection(db,'users',uid,'intentos'),{pts:pts,n:L.length,ci:ci,miss:miss,t:serverTimestamp()});
  if(!old||pts>old.pts)await setDoc(ref,{name:nombre,ci:ci,pts:pts,n:L.length,t:serverTimestamp()});
  box.innerHTML='<h2>Podio</h2><div class="pd" id="pd"></div><ol id="rl"></ol><h2 style="margin-top:22px">Tus intentos</h2><ol id="mi"></ol>';
  stop();
  unsub=onSnapshot(query(collection(db,'scores'),orderBy('pts','desc'),limit(30)),function(q){
   var l=document.getElementById('rl');if(!l)return;
   var a=q.docs.map(function(d){var x=d.data();x.id=d.id;return x}).sort(function(u,v){return v.pts-u.pts||((u.t&&u.t.seconds)||0)-((v.t&&v.t.seconds)||0)});
   var pd=document.getElementById('pd'),md=['🥇','🥈','🥉'],cl=['#e0a82e','#b9c2c0','#b87333'],hs=[100,76,54];
   pd.innerHTML=a.length?[1,0,2].map(function(k){var x=a[k];if(!x)return '<div></div>';return '<div><div style="font-size:1.8rem">'+md[k]+'</div><div class="pn">'+esc(String(x.name||'Anónimo'))+(x.id===uid?' (vos)':'')+'</div><div class="small">CI '+(+x.ci||0)+' · '+(+x.pts||0)+'/'+(+x.n||0)+'</div><div class="st" style="height:'+hs[k]+'px;background:'+cl[k]+'">'+(k+1)+'</div></div>'}).join(''):'<p class="small">Todavía no hay resultados. ¡Sé el primero!</p>';
   l.innerHTML=a.slice(3).map(function(x,k){return '<li'+(x.id===uid?' class="me"':'')+'><b>'+(k+4)+'</b><span>'+esc(String(x.name||'Anónimo'))+(x.id===uid?' (vos)':'')+'</span><em>CI '+(+x.ci||0)+'</em><span class="small" style="flex:none">'+(+x.pts||0)+'/'+(+x.n||0)+'</span></li>'}).join('');
  },function(){});
  var h=await getDocs(query(collection(db,'users',uid,'intentos'),orderBy('t','desc'),limit(5))),m=document.getElementById('mi');
  if(m)m.innerHTML=h.docs.map(function(d){var x=d.data(),f=x.t&&x.t.toDate?x.t.toDate().toLocaleDateString('es-HN'):'hoy';return '<li><span>'+f+'</span><em>CI '+(+x.ci||0)+'</em><span class="small" style="flex:none">'+(+x.pts||0)+'/'+(+x.n||0)+'</span></li>'}).join('');
 }catch(e){box.innerHTML='<p class="small">No se pudo guardar o leer el ranking ('+esc(e.code||'error')+'). Revisá las reglas de Firestore.</p>'}
}
function diploma(){
 var fr=pts/L.length,ci=70+Math.round(fr*75);
 var r=T.filter(function(x){return fr>=x.f})[0];
 var hoy=new Date().toLocaleDateString('es-HN',{day:'numeric',month:'long',year:'numeric'});
 app.innerHTML='<div class="dip"><h2>Diploma de Inteligencia</h2><p>Se otorga a</p><div class="nm">'+esc(nombre)+'</div><p style="margin-top:10px">por contestar '+pts+' de '+L.length+' preguntas correctas'+(miss?' ('+miss+' se le pasó el tiempo)':'')+', con un coeficiente intelectual de</p><div class="ci">'+ci+'</div><div class="ttl">'+r.t+'</div><p>'+r.m+'</p><div class="seal">OFICIAL</div><p class="small" style="margin:0">'+hoy+'</p></div><div class="btns"><button id="sh">Retar a mis amigos</button><button class="alt" id="re">Repetir el test</button><button class="alt" id="ot">Que lo haga otra persona</button></div><div class="rk" id="rk"><p class="small">Conectando al ranking…</p></div><p class="small" style="margin-top:14px">Tomá captura de pantalla para guardar tu diploma. Solo diversión.</p>';
 document.getElementById('re').onclick=empezar;
 document.getElementById('sh').onclick=function(){compartir(ci,pts,this)};
 ranking(ci,pts);
 document.getElementById('ot').onclick=inicio;
 window.scrollTo(0,0);
}
onAuthStateChanged(auth,function(u){user=u;if(!jugando)inicio()});
inicio();
</script>
</body>
</html>
