<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@500;800&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1624;--card:#152338;--line:#2a3f5c;--ink:#eef2f7;--mut:#9fb0c6;--gold:#f2b84b;--ok:#58c48a;--bad:#e5584b;--paper:#eef3f9;--green:#12263f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:18px 16px 44px}
h1,h2{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;line-height:1.2;margin:0 0 14px}
h1{font-size:2.4rem;color:var(--gold)}
h2{font-size:1.3rem}
p{line-height:1.5;margin:0 0 14px}
input{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:14px}
input:focus{border-color:var(--gold)}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:12px;padding:15px 18px;background:var(--gold);color:#1b1405;width:100%}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.small{font-size:.85rem;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:6px;margin-bottom:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-weight:800;font-size:.88rem}
.chip i{width:10px;height:10px;border-radius:50%}
.ring{position:relative;width:58px;height:58px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--ok);stroke-linecap:round;stroke-dasharray:150.8;stroke-dashoffset:0;transition-property:stroke-dashoffset;transition-timing-function:linear}
.ring.low .fg{stroke:var(--bad)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Alfa Slab One',serif;font-weight:400;font-size:1.15rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.big{font-size:3rem;line-height:1.25;text-align:center;margin:2px 0 14px;letter-spacing:.05em;overflow-wrap:anywhere}
.mem{font-size:2.2rem;font-family:'Alfa Slab One',serif;color:var(--gold);margin:10px 0}
.opt{display:flex;gap:12px;align-items:center;background:var(--card);color:var(--ink);text-align:left;margin-bottom:10px;border:2px solid var(--line);font-weight:500;transition:transform .12s,border-color .12s,background .12s}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-weight:800;font-size:.9rem}
@media(hover:hover){.opt:hover{border-color:var(--gold)}}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--gold);background:#22364f}
.opt.sel .k{background:var(--gold);color:#1b1405}
.opt.off{opacity:.4;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
.stats b{display:block;font-family:'Alfa Slab One',serif;font-weight:400;font-size:1.5rem;color:var(--gold)}
.brk{margin-top:18px}
.brk div{display:grid;grid-template-columns:104px 1fr 40px;gap:10px;align-items:center;margin-bottom:9px;font-size:.9rem}
.brk .tr{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.brk .tr i{display:block;height:100%;background:var(--ok)}
.dip{background:var(--paper);color:var(--green);border:10px double #c9962b;padding:26px 16px;text-align:center;border-radius:4px}
.dip h2{font-size:1.5rem;color:var(--green)}
.nm{font-family:'Pinyon Script',cursive;font-size:2.6rem;line-height:1.1;margin:6px 0;border-bottom:2px solid var(--green);display:inline-block;padding:0 10px;max-width:100%;overflow-wrap:anywhere}
.ci{font-family:'Alfa Slab One',serif;font-size:4rem;line-height:1;margin:10px 0 2px}
.ttl{font-weight:800;font-size:1.15rem;margin:8px 0}
.dip .small{color:var(--green);opacity:.75}
.seal{width:84px;height:84px;border-radius:50%;margin:16px auto 8px;background:radial-gradient(circle,#f1c453,#b8841c);color:#4a3306;display:grid;place-items:center;font-family:'Alfa Slab One',serif;font-size:.8rem;box-shadow:0 0 0 5px #eef3f9,0 0 0 8px #c9962b}
.btns{display:grid;gap:10px;margin-top:16px}
.btns .alt{background:transparent;color:var(--ink);border:2px solid var(--gold)}
.rk{margin-top:26px}
.rk ol{list-style:none;margin:0 0 10px;padding:0}
.rk li{display:flex;gap:10px;align-items:baseline;background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.rk li.me{border:2px solid var(--gold)}
.rk b{font-family:'Alfa Slab One',serif;font-weight:400;color:var(--gold);min-width:1.8em}
.rk span{flex:1;overflow-wrap:anywhere}
.rk em{font-style:normal;font-weight:800}
.pd{display:flex;align-items:flex-end;gap:8px;margin:12px 0 20px}
.pd>div{flex:1;text-align:center;min-width:0}
.pd .pn{font-weight:800;overflow-wrap:anywhere;line-height:1.2}
.pd .st{border-radius:8px 8px 0 0;display:grid;place-items:center;margin-top:6px;color:#1b1405;font-family:'Alfa Slab One',serif;font-size:1.6rem}
@media(prefers-reduced-motion:reduce){.bar i,.opt{transition:none}}
</style>
</head>

  },function(){});
  var h=await getDocs(query(collection(db,'users',uid,'intentos'),orderBy('t','desc'),limit(5))),m=document.getElementById('mi');
  if(m)m.innerHTML=h.docs.map(function(d){var x=d.data(),f=x.t&&x.t.toDate?x.t.toDate().toLocaleDateString('es-HN'):'hoy';return '<li><span>'+f+'</span><em>CI '+(+x.ci||0)+'</em><span class="small" style="flex:none">'+(+x.pts||0)+'/'+(+x.n||0)+'</span></li>'}).join('');
 }catch(e){box.innerHTML='<p class="small">No se pudo guardar o leer el ranking ('+esc(e.code||'error')+'). Revisá las reglas de Firestore.</p>'}
}
function diploma(){
 var fr=pts/TOT,ci=70+Math.round(fr*75);
 var r=T.filter(function(x){return fr>=x.f})[0];
 var hoy=new Date().toLocaleDateString('es-HN',{day:'numeric',month:'long',year:'numeric'});
 app.innerHTML='<div class="dip"><h2>Diploma de Inteligencia</h2><p>Se otorga a</p><div class="nm">'+esc(nombre)+'</div><p style="margin-top:10px">por contestar '+pts+' de '+TOT+' preguntas correctas'+(miss?' ('+miss+' se le pasó el tiempo)':'')+', con un coeficiente intelectual de</p><div class="ci">'+ci+'</div><div class="ttl">'+r.t+'</div><p>'+r.m+'</p><div class="seal">OFICIAL</div><p class="small" style="margin:0">'+hoy+'</p></div>'+brk()+'<div class="btns"><button id="sh">Retar a mis amigos</button><button class="alt" id="re">Repetir el test</button><button class="alt" id="ot">Que lo haga otra persona</button></div><div class="rk" id="rk"><p class="small">Conectando al ranking…</p></div><p class="small" style="margin-top:14px">Tomá captura de pantalla para guardar tu diploma. Solo diversión.</p>';
 document.getElementById('re').onclick=empezar;
 document.getElementById('sh').onclick=function(){compartir(ci,pts,this)};
 ranking(ci,pts);
 document.getElementById('ot').onclick=inicio;
 window.scrollTo(0,0);
}
onAuthStateChanged(auth,function(u){user=u;if(!jugando)inicio()});
inicio();
</script>
